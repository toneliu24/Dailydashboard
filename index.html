<!-- WeekView: 69 lines -->
<script type="text/babel" data-presets="react">

function WeekView({curY,curM,selDay,totalDays,todayD,isCurrentMonth,getDayTheme,getDayTasks,done,getMeta,daySchedule,HOURS,HOUR_START,HOUR_END,SLOT_H,fmt,THEME_META,setSelDay,setCalMode,getWeekday}) {
  const wd=getWeekday(curY,curM,selDay);
  const mondayOff=wd===0?-6:1-wd;
  const weekDs=Array.from({length:7},(_,i)=>{const d=selDay+mondayOff+i;return (d>=1&&d<=totalDays)?d:null;});
  return(
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      <div style={{display:"flex",flexDirection:"column",width:"100%",overflow:"hidden"}}>
        <div style={{display:"flex",borderBottom:"1px solid #f0ede8",flexShrink:0}}>
          <div style={{width:44,flexShrink:0}}/>
          {weekDs.map((day,wi)=>{
            if(!day) return <div key={wi} style={{flex:1}}/>;
            const meta=THEME_META[getDayTheme(day)]||THEME_META.free;
            const isToday=isCurrentMonth&&day===todayD;
            const isSel=day===selDay;
            const total=getDayTasks(day).length;
            const comp=getDayTasks(day).filter((_,i)=>done[day+"-"+i]).length;
            return(
              <div key={day} onClick={()=>{setSelDay(day);setCalMode("day");}} style={{flex:1,padding:"6px 2px",textAlign:"center",cursor:"pointer",background:isSel?meta.color:meta.bg,borderRight:"1px solid #f0ede8"}}>
                <div style={{fontSize:9,fontFamily:"monospace",color:isSel?"rgba(255,255,255,0.7)":meta.color}}>{["日","一","二","三","四","五","六"][getWeekday(curY,curM,day)]}</div>
                <div style={{fontSize:14,fontWeight:700,color:isSel?"#fff":meta.color,background:isToday&&!isSel?meta.color:"transparent",borderRadius:5,display:"inline-block",padding:isToday&&!isSel?"1px 5px":"0"}}>{day}</div>
                {total>0&&<div style={{fontSize:9,color:isSel?"rgba(255,255,255,0.8)":comp===total?"#7A9E7E":meta.color,marginTop:1}}>{comp}/{total}</div>}
              </div>
            );
          })}
        </div>
        <div style={{flex:1,overflowY:"auto"}}>
          <div style={{position:"relative",height:SLOT_H*(HOUR_END-HOUR_START+1),display:"flex"}}>
            <div style={{width:44,flexShrink:0}}>
              {HOURS.map(h=>(
                <div key={h} style={{height:SLOT_H,borderBottom:"1px solid #f0ede8",display:"flex",alignItems:"flex-start",justifyContent:"flex-end",paddingRight:6,paddingTop:4}}>
                  <span style={{fontSize:10,fontFamily:"monospace",color:"#ccc"}}>{fmt(h)}</span>
                </div>
              ))}
            </div>
            {weekDs.map((day,wi)=>{
              if(!day) return <div key={wi} style={{flex:1,borderRight:"1px solid #f0ede8"}}/>;
              const meta=THEME_META[getDayTheme(day)]||THEME_META.free;
              const isSel=day===selDay;
              const sched=daySchedule(day);
              return(
                <div key={day} style={{flex:1,position:"relative",borderRight:"1px solid #f0ede8",background:isSel?meta.color+"04":"transparent"}}>
                  {HOURS.map(h=><div key={h} style={{height:SLOT_H,borderBottom:"1px solid #f8f5f2"}}/>)}
                  {isCurrentMonth&&day===todayD&&(()=>{
                    const now=new Date(),top=((now.getHours()-HOUR_START)+now.getMinutes()/60)*SLOT_H;
                    if(top<0||top>SLOT_H*(HOUR_END-HOUR_START+1)) return null;
                    return <div style={{position:"absolute",left:0,right:0,top:top,height:2,background:"#E53E3E",zIndex:10,pointerEvents:"none"}}/>;
                  })()}
                  {sched.map(block=>{
                    const durMins=block.durH*60+(block.durM||0);
                    const bTop=(block.startH-HOUR_START)*SLOT_H+(block.startM||0)/60*SLOT_H;
                    const bH=Math.max(SLOT_H*0.5,durMins/60*SLOT_H);
                    return(
                      <div key={block.id} onClick={()=>{setSelDay(day);setCalMode("day");}}
                        style={{position:"absolute",top:bTop+1,left:2,right:2,height:bH-2,background:meta.bg,borderLeft:"3px solid "+meta.color,border:"1.5px solid "+meta.color,borderRadius:5,padding:"2px 4px",overflow:"hidden",cursor:"pointer",zIndex:5}}>
                        <div style={{fontSize:9,fontFamily:"monospace",color:meta.color}}>{fmt(block.startH,block.startM||0)}</div>
                        <div style={{fontSize:10,fontWeight:600,color:"#1A1612",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{block.taskText}</div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

</script>

<!-- DashboardView: 219 lines -->
<script type="text/babel" data-presets="react">

function DashboardView({
  curY,curM,mk,cfg,totalDays,todayD,isCurrentMonth,
  MONTH_NAMES,THEME_META,PRIORITY,
  getDayTheme,getDayTasks,done,getMeta,daySchedule,goals,
  setView,setSelDay,setTasks,setQuickForm,setQuickAdd,
  quickAddToast,setQuickAddToast,getWeekday,isWeekend,
}) {
  // Computed
  const workdays=Array.from({length:totalDays},(_,i)=>i+1).filter(d=>!isWeekend(curY,curM,d));
  const passedDays=workdays.filter(d=>d<=(isCurrentMonth?todayD:totalDays));
  const totalTasksCount=workdays.reduce((s,d)=>s+getDayTasks(d).length,0);
  const doneTasksCount=workdays.reduce((s,d)=>s+getDayTasks(d).filter((_,i)=>done[d+"-"+i]).length,0);
  const pct=totalTasksCount>0?Math.round(doneTasksCount/totalTasksCount*100):0;
  const today2=isCurrentMonth?todayD:1;
  const upcoming=[];
  for(let d=today2;d<=totalDays;d++){
    if(isWeekend(curY,curM,d)) continue;
    getDayTasks(d).forEach((t,i)=>{ if(!done[d+"-"+i]){ const m=getMeta(d,i); upcoming.push({day:d,task:t,idx:i,priority:m.priority,estMins:m.estMins}); }});
  }
  const pOrder={must:0,should:1,nice:2};
  const top5=upcoming.sort((a,b)=>pOrder[a.priority]-pOrder[b.priority]||a.day-b.day).slice(0,5);
  const goalSummary=goals.map(g=>({...g,pct:Math.min(100,Math.round(g.count/g.target*100))}));
  const todayTheme=THEME_META[getDayTheme(today2)]||THEME_META.free;
  const todayTasks=getDayTasks(today2);
  const todayDone=todayTasks.filter((_,i)=>done[today2+"-"+i]).length;
  const todaySched=daySchedule(today2);
  const todayWd=isCurrentMonth?getWeekday(curY,curM,todayD):1;
  const mondayOffset=(todayWd===0?-6:1-todayWd);
  const weekDays=Array.from({length:7},(_,i)=>{
    const d=(isCurrentMonth?todayD:1)+mondayOffset+i;
    return (d>=1&&d<=totalDays)?d:null;
  });
  const fmt2=(h,m=0)=>String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  return (
    <div style={{padding:"14px 14px 80px",overflowY:"auto",minHeight:"calc(100dvh - 50px)"}}>

      {/* Greeting */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:"#9C8070",fontFamily:"monospace",letterSpacing:1,marginBottom:4}}>{curY} · {MONTH_NAMES[curM-1]}{isCurrentMonth?` · 今天 ${curM}/${todayD}`:""}</div>
        <div style={{fontSize:22,fontWeight:700,color:"#3D2B1F",letterSpacing:"-0.5px"}}>{cfg.name||MONTH_NAMES[curM-1]}</div>
      </div>

      {/* TODAY BLOCK */}
      <div style={{background:todayTheme.bg,borderRadius:16,padding:"16px",marginBottom:14,border:"1.5px solid "+todayTheme.color+"30",boxShadow:"0 2px 12px "+todayTheme.color+"20",cursor:"pointer"}}
        onClick={()=>{setSelDay(today2);setView("today");}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div>
            <div style={{fontSize:10,color:todayTheme.color,fontFamily:"monospace",letterSpacing:1.5,marginBottom:3,opacity:0.8}}>
              {isCurrentMonth?"TODAY":"本月起點"} · {curM}/{today2}
            </div>
            <div style={{fontSize:20,fontWeight:700,color:todayTheme.color}}>{todayTheme.icon} {todayTheme.label}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:10,color:todayTheme.color,opacity:0.7,marginBottom:2}}>今日任務</div>
            <div style={{fontSize:22,fontWeight:700,color:todayTheme.color}}>{todayDone}<span style={{fontSize:13,fontWeight:400,opacity:0.6}}>/{todayTasks.length}</span></div>
          </div>
        </div>
        {todaySched.length>0?(
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {todaySched.slice(0,3).map(b=>{
              return <div key={b.id} style={{display:"flex",alignItems:"center",gap:8,background:todayTheme.color+"12",borderRadius:8,padding:"6px 10px"}}>
                <div style={{width:3,minHeight:16,background:todayTheme.color,borderRadius:2,flexShrink:0}}/>
                <div style={{fontSize:11,fontFamily:"monospace",color:todayTheme.color,flexShrink:0}}>{fmt2(b.startH,b.startM||0)}</div>
                <div style={{fontSize:12,color:"#3D2B1F",fontWeight:500,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.taskText}</div>
              </div>;
            })}
            {todaySched.length>3&&<div style={{fontSize:10,color:todayTheme.color,opacity:0.7,paddingLeft:4}}>+{todaySched.length-3} 個行程</div>}
          </div>
        ):(
          <div style={{fontSize:12,color:todayTheme.color,opacity:0.6,fontStyle:"italic"}}>{todayTasks.length>0?"尚未排入行程 — 點此安排":"點此新增今日任務"}</div>
        )}
        {todayTasks.length>0&&<div style={{marginTop:10}}><div style={{background:todayTheme.color+"20",borderRadius:4,height:4}}><div style={{background:todayTheme.color,borderRadius:4,height:"100%",width:(todayTasks.length?Math.round(todayDone/todayTasks.length*100):0)+"%",transition:"width 0.4s"}}/></div></div>}
      </div>

      {/* QUICK ADD */}
      <div style={{background:"#FDFAF6",borderRadius:14,border:"1px solid #E8DDD4",overflow:"hidden",marginBottom:14,boxShadow:"0 1px 4px rgba(61,43,31,0.05)"}}>
        <div style={{padding:"12px 14px"}}>
          <div style={{fontSize:13,fontWeight:700,color:"#3D2B1F",marginBottom:10}}>＋ 快速新增任務</div>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <input placeholder="輸入任務名稱..." id="quick-task-input"
              style={{flex:1,padding:"10px 12px",borderRadius:10,border:"1.5px solid #E8DDD4",fontSize:14,fontFamily:"'Noto Serif TC',serif",color:"#3D2B1F",background:"#F7F3EE",outline:"none"}}
              onKeyDown={(e)=>{
                if(e.key==="Enter"){
                  const text=e.target.value.trim();
                  if(!text) return;
                  const d=isCurrentMonth?todayD:1;
                  setTasks(p=>({...p,[d]:[...(p[d]||[]),text]}));
                  e.target.value="";
                  setQuickAddToast("已加到 "+curM+"/"+d);
                  setTimeout(()=>setQuickAddToast(""),2000);
                }
              }}/>
            <button onClick={()=>{
              const input=document.getElementById("quick-task-input");
              const text=input&&input.value.trim();
              if(!text) return;
              const d=isCurrentMonth?todayD:1;
              setTasks(p=>({...p,[d]:[...(p[d]||[]),text]}));
              if(input) input.value="";
              setQuickAddToast("已加到 "+curM+"/"+d);
              setTimeout(()=>setQuickAddToast(""),2000);
            }} style={{flexShrink:0,background:"#C4855A",border:"none",borderRadius:10,padding:"10px 16px",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>新增</button>
          </div>
          {quickAddToast&&<div style={{background:"#EEF6EE",borderRadius:8,padding:"7px 12px",fontSize:12,color:"#3D7A3D",fontWeight:500,marginBottom:8}}>✅ {quickAddToast}</div>}
          <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:"#9C8070"}}>加到：</span>
            {[0,1,2].map(offset=>{
              const d=(isCurrentMonth?todayD:1)+offset;
              if(d<1||d>totalDays||isWeekend(curY,curM,d)) return null;
              const m=THEME_META[getDayTheme(d)]||THEME_META.free;
              return <button key={d} onClick={()=>{
                const input=document.getElementById("quick-task-input");
                const text=input&&input.value.trim();
                if(!text) return;
                setTasks(p=>({...p,[d]:[...(p[d]||[]),text]}));
                if(input) input.value="";
                setQuickAddToast("已加到 "+curM+"/"+d);
                setTimeout(()=>setQuickAddToast(""),2000);
              }} style={{padding:"5px 10px",borderRadius:8,border:"1px solid "+m.color+"40",background:m.bg,color:m.color,fontSize:11,fontFamily:"monospace",cursor:"pointer"}}>{curM}/{d} {m.icon}</button>;
            })}
            <button onClick={()=>{setQuickForm({text:"",hour:"9",min:"0"});setQuickAdd(true);}}
              style={{padding:"5px 10px",borderRadius:8,border:"1px solid #E8DDD4",background:"transparent",color:"#9C8070",fontSize:11,cursor:"pointer"}}>指定…</button>
          </div>
        </div>
      </div>

      {/* MONTH PROGRESS */}
      <div style={{background:"#FDFAF6",borderRadius:14,padding:"14px",marginBottom:14,border:"1px solid #E8DDD4",boxShadow:"0 1px 4px rgba(61,43,31,0.05)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div><div style={{fontSize:11,color:"#9C8070",marginBottom:2}}>本月進度</div><div style={{fontSize:22,fontWeight:700,color:"#3D2B1F"}}>{pct}<span style={{fontSize:13,fontWeight:400,color:"#9C8070"}}>%</span></div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:11,color:"#9C8070",marginBottom:2}}>完成 / 總計</div><div style={{fontSize:16,fontWeight:600,color:"#C4855A"}}>{doneTasksCount}<span style={{color:"#ccc",fontWeight:300}}> / {totalTasksCount}</span></div></div>
        </div>
        <div style={{background:"#F0EAE3",borderRadius:6,height:6}}><div style={{background:"linear-gradient(90deg,#C4855A,#C9A84C)",borderRadius:6,height:"100%",width:pct+"%",transition:"width 0.6s"}}/></div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>
          <div style={{fontSize:10,color:"#9C8070",fontFamily:"monospace"}}>{passedDays.length}/{workdays.length} 工作天</div>
          {isCurrentMonth&&<div style={{fontSize:10,color:"#9C8070",fontFamily:"monospace"}}>還剩 {workdays.filter(d=>d>todayD).length} 天</div>}
        </div>
      </div>

      {/* TOP 5 */}

            <span style={{position:"absolute",top:8,right:8,fontSize:9,color:"#ccc"}}>›</span>

      </div>

      {/* WEEK PREVIEW */}
      <div style={{background:"#FDFAF6",borderRadius:14,border:"1px solid #E8DDD4",padding:"12px 12px",boxShadow:"0 1px 4px rgba(61,43,31,0.05)"}}>
        <div style={{fontSize:11,color:"#9C8070",fontFamily:"monospace",letterSpacing:1,marginBottom:10}}>本週預覽</div>

                <div style={{fontSize:13,fontWeight:700,color:isToday3?"#fff":meta.color,marginBottom:4}}>{day}</div>
                {!weekend2&&(
                  <div>
                    <div style={{fontSize:10,color:isToday3?"rgba(255,255,255,0.9)":total2>0&&comp2===total2?"#7A9E7E":meta.color,fontWeight:600}}>{total2>0?comp2+"/"+total2:"—"}</div>
                    {sched2>0&&<div style={{fontSize:9,marginTop:2}}>⏰{sched2}</div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

    </div>
  );
}

</script>

<script type="text/babel" data-presets="react">

            {/* Date strip — shown only in day mode */}
            {calMode==="day"&&(
              <div style={{overflowX:"auto",display:"flex",gap:4,paddingBottom:2}}>
                {Array.from({length:totalDays},(_,i)=>i+1).map(d=>{
                  const m=THEME_META[getDayTheme(d)]||THEME_META.free;
                  const isSel=d===selDay,isToday=isCurrentMonth&&d===todayD;
                  return <button key={d} onClick={()=>setSelDay(d)} style={{minWidth:30,height:30,borderRadius:7,background:isSel?m.color:m.bg,border:isToday?`2px solid ${m.color}`:`1px solid ${m.color}20`,color:isSel?"#fff":m.color,fontSize:11,fontFamily:"monospace",fontWeight:isSel?700:400,cursor:"pointer",flexShrink:0}}>{d}</button>;

                      onMouseEnter={e=>e.currentTarget.style.transform="translateY(-1px)"}
                      onMouseLeave={e=>e.currentTarget.style.transform=""}
                    >
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <span style={{fontFamily:"monospace",fontSize:12,fontWeight:700,background:isToday&&!isSel?meta.color:"transparent",color:isToday&&!isSel?"#fff":(isSel?"#fff":meta.color),borderRadius:4,padding:isToday&&!isSel?"1px 5px":"0"}}>{day}</span>

                        <div style={{display:"flex",flexWrap:"wrap",gap:2}}>

                            const isDone=!!done[`${day}-${i}`];
                            const pColor=PRIORITY[getMeta(day,i).priority]?.color||"#aaa";
                            return <span key={i} style={{width:6,height:6,borderRadius:"50%",background:isDone?"#ddd":(isSel?"rgba(255,255,255,0.7)":pColor),opacity:isDone?0.4:1}}/>;
                          })}
                        </div>
                      )}
                      {!weekend&&total>0&&<div style={{marginTop:"auto"}}>
                        <div style={{background:isSel?"rgba(255,255,255,0.25)":`${meta.color}20`,borderRadius:2,height:2}}>
                          <div style={{background:isSel?"#fff":meta.color,borderRadius:2,height:"100%",width:`${total?(comp/total)*100:0}%`}}/>
                        </div>
                        {sched>0&&<div style={{fontSize:8,fontFamily:"monospace",color:isSel?"rgba(255,255,255,0.6)":meta.color,marginTop:1}}>⏰{sched}</div>}
                      </div>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ── WEEK MODE ── */}
          {calMode==="week"&&WeekView({
            curY,curM,selDay,totalDays,todayD,isCurrentMonth,
            getDayTheme,getDayTasks,done,getMeta,daySchedule,
            HOURS,HOUR_START,HOUR_END,SLOT_H,fmt,THEME_META,WEEKDAY_NAMES,
            setSelDay,setCalMode,getWeekday,
          })}

          {/* ── DAY MODE (existing) ── */}
          {calMode==="day"&&(
            <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>

              {/* Task list — top half */}
              <div style={{flexShrink:0,background:"#FAF8F4",borderBottom:`1px solid ${theme.color}20`,maxHeight:"40vh",overflow:"hidden",display:"flex",flexDirection:"column"}}>
                {/* Task header */}
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 14px 6px",flexShrink:0}}>

                    <button onClick={()=>{setQuickForm({text:"",hour:"9",min:"0"});setQuickAdd(true);}}
                      style={{background:theme.color,border:"none",borderRadius:7,padding:"4px 12px",cursor:"pointer",fontSize:12,color:"#fff",fontWeight:600}}>＋ 新增</button>
                  </div>
                </div>
                {/* Task rows */}
                <div style={{overflowY:"auto",padding:"0 10px 8px"}}>
                  {getDayTasks(selDay).length===0&&(
                    <div style={{textAlign:"center",padding:"12px",fontSize:12,color:"#ccc"}}>點「＋ 新增」加入今日任務</div>
                  )}
                  {getDayTasks(selDay).map((task,i)=>{
                    const isDone=!!done[`${selDay}-${i}`];
                    const inSched=daySchedule(selDay).some(b=>b.taskText===task);
                    const meta=getMeta(selDay,i);
                    const pColor=PRIORITY[meta.priority]?.color||"#aaa";
                    return (
                      <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",marginBottom:4,background:isDone?"#f5f2ee":inSched?`${theme.color}10`:"#fff",borderRadius:10,border:`1px solid ${inSched?theme.color+"40":"#ede9e4"}`}}>
                        {/* Checkbox */}
                        <div onClick={()=>toggleDone(selDay,i)} style={{width:22,height:22,borderRadius:6,flexShrink:0,border:`2px solid ${isDone?theme.color:"#d0cbc4"}`,background:isDone?theme.color:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                          {isDone&&<span style={{color:"#fff",fontSize:13,lineHeight:1}}>✓</span>}
                        </div>
                        {/* Task name */}
                        <span style={{flex:1,fontSize:14,lineHeight:1.4,color:isDone?"#bbb":"#1A1612",textDecoration:isDone?"line-through":"none"}}>{task}</span>
                        {/* Schedule button — tap to pick time */}

                    const bH=Math.max(SLOT_H*0.5,durMins/60*SLOT_H);

                    const endMins=(block.startH*60+(block.startM||0))+block.durH*60+(block.durM||0);

                        background:theme.bg,
                        border:`1.5px solid ${theme.color}`,
                        borderLeft:`4px solid ${theme.color}`,
                        borderRadius:8,
                        boxShadow:isDragging?`0 8px 24px ${theme.color}40`:`0 2px 10px ${theme.color}20`,

                        userSelect:"none",touchAction:"none",zIndex:isDragging?20:5,
                        opacity:isDragging?0.92:1,
                        transition:isDragging?"none":"box-shadow 0.15s",

                      <div
                        onMouseDown={(e)=>startBlockDrag(e,"move",block)}
                        onTouchStart={(e)=>startBlockDrag(e,"move",block)}
                        style={{padding:"5px 8px",cursor:"ns-resize",height:"calc(100% - 14px)",overflow:"hidden"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                          <div style={{flex:1,minWidth:0}}>

                            <button onClick={(e)=>{e.stopPropagation();removeBlock(selDay,block.id);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:"#ccc",padding:"0 3px",lineHeight:1}}>✕</button>
                          </div>
                        </div>
                      </div>
                      {/* Resize handle — drag to EXTEND */}
                      <div
                        onMouseDown={(e)=>startBlockDrag(e,"resize",block)}

                          position:"absolute",bottom:0,left:0,right:0,
                          height:14,cursor:"s-resize",
                          display:"flex",alignItems:"center",justifyContent:"center",
                          borderTop:`1px dashed ${theme.color}40`,

                          background:`${theme.color}08`,

                        <div style={{width:24,height:3,borderRadius:2,background:theme.color,opacity:0.4}}/>
                      </div>
                    </div>;

              </div>

              {/* Note bar */}
              <div style={{borderTop:"1px solid #e8e4de",background:"#FAF8F4",padding:"8px 14px",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                <span style={{fontSize:14,opacity:0.5}}>📝</span>
                <input value={dayNote} onChange={e=>setNote(p=>({...p,[selDay]:e.target.value}))} placeholder="今日筆記" style={{flex:1,border:"none",background:"transparent",fontSize:13,fontFamily:"'Noto Serif TC',serif",color:"#1A1612",outline:"none"}}/>
              </div>
            </div>

          ) : (
            /* ── DESKTOP: original side-by-side layout ── */
            <>
            <div style={{display:"flex",flex:1,overflow:"hidden"}}>

  // blockDrag = { type:"move"|"resize", id, day,
  //   startY, origStartH, origStartM, origDurH, origDurM }
  const [dragBlockId, setDragBlockId] = useState(null); // currently dragging block id

  // ── RESPONSIVE ──
  useEffect(()=>{
    const fn=()=>setIsMobile(window.innerWidth<640);
    window.addEventListener("resize",fn);
    return ()=>window.removeEventListener("resize",fn);
  },[]);

  // ── LOAD / SAVE ──
  const latestState = useRef({allMonthData,goals,builds,allConfigs});
  useEffect(()=>{ latestState.current={allMonthData,goals,builds,allConfigs}; });

  useEffect(()=>{
    loadData().then(s=>{
      if(s){
        if(s.allMonthData) setAllMonthData(s.allMonthData);
        if(s.goals)        setGoals(s.goals);
        if(s.builds)       setBuilds(s.builds);
        if(s.allConfigs)   setAllConfigs(s.allConfigs);
      }
      setLoaded(true);
    });
    const handleUnload=()=>saveDataSync(latestState.current);
    window.addEventListener("beforeunload",handleUnload);
    document.addEventListener("visibilitychange",()=>{
      if(document.visibilityState==="hidden") saveDataSync(latestState.current);
    });
    return ()=>window.removeEventListener("beforeunload",handleUnload);
  },[]);

  const saveTimer=useRef(null);
  useEffect(()=>{
    if(!loaded) return;
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>saveData({allMonthData,goals,builds,allConfigs}),600);
    return ()=>clearTimeout(saveTimer.current);
  },[allMonthData,goals,builds,allConfigs,loaded]);

  // ── TASK HELPERS ──
  const getDayTasks    = (d)   => tasks[d] || [];
  const completedCount = (d)   => getDayTasks(d).filter((_,i)=>done[`${d}-${i}`]).length;
  const getMeta        = (d,i) => taskMeta[`${d}-${i}`] || {priority:"nice",estMins:60};
  const setMeta        = (d,i,patch) => setTaskMeta(p=>({...p,[`${d}-${i}`]:{...getMeta(d,i),...patch}}));
  const openEditTask   = (d)   => { setEditDay(d); setEditText(getDayTasks(d).join("\n")); };
  const saveEditTask   = ()    => { setTasks(p=>({...p,[editDay]:editText.split("\n").map(l=>l.trim()).filter(Boolean)})); setEditDay(null); };

  const toggleDone = (day,idx) => {
    const key=`${day}-${idx}`;
    const wasUndone=!done[key];
    setDone(p=>({...p,[key]:wasUndone}));
    if(wasUndone) setGoalLink({taskName:getDayTasks(day)[idx]});
  };

  // ── GOAL HELPERS ──
  const bumpGoal    = (id,delta) => setGoals(p=>p.map(g=>g.id===id?{...g,count:Math.max(0,Math.min(g.target,g.count+delta))}:g));
  const openEditGoal= (g)        => { setEditGoalId(g.id); setEditGoalForm({name:g.name,icon:g.icon,target:String(g.target),unit:g.unit,scope:g.scope||"month"}); };
  const openAddGoal = ()         => { setEditGoalId("__new__"); setEditGoalForm({name:"",icon:"⭐",target:"1",unit:"次",scope:"month",_id:uid()}); };
  const saveGoalEdit= ()         => {
    const target=Math.max(1,parseInt(editGoalForm.target)||1);
    if(editGoalId==="__new__") setGoals(p=>[...p,{id:editGoalForm._id||uid(),icon:editGoalForm.icon||"⭐",name:editGoalForm.name||"新目標",target,unit:editGoalForm.unit||"次",count:0,scope:editGoalForm.scope||"month"}]);
    else setGoals(p=>p.map(g=>g.id===editGoalId?{...g,...editGoalForm,target}:g));
    setEditGoalId(null);
  };
  const deleteGoal=(id)=>{ setGoals(p=>p.filter(g=>g.id!==id)); setEditGoalId(null); };

  // ── SCHEDULE HELPERS ──
  const daySchedule  = (d)   => schedule[d] || [];
  const addBlock     = (d,taskText,startH,startM=0,durH=1,durM=0) => setSchedule(p=>({...p,[d]:[...(p[d]||[]),{id:uid(),taskText,startH,startM,durH,durM}]}));
  const removeBlock  = (d,id)=> setSchedule(p=>({...p,[d]:(p[d]||[]).filter(b=>b.id!==id)}));
  const openEditBlock= (d,block)=>{ setEditBlock({day:d,id:block.id}); setEditBlockForm({taskText:block.taskText,startH:String(block.startH),startM:String(block.startM||0),durH:String(block.durH),durM:String(block.durM||0)}); };
  const saveEditBlock= ()=>{
    const {day,id}=editBlock;
    setSchedule(p=>({...p,[day]:(p[day]||[]).map(b=>b.id!==id?b:{...b,taskText:editBlockForm.taskText,startH:parseInt(editBlockForm.startH)||HOUR_START,startM:parseInt(editBlockForm.startM)||0,durH:parseInt(editBlockForm.durH)||0,durM:parseInt(editBlockForm.durM)||0})}));
    setEditBlock(null);
  };

  // ── MONTH CONFIG ──
  const saveCfgPatch = (patch) => setAllConfigs(p=>({...p,[mk]:{...cfg,...patch}}));

  // ── DRAG ──
  const createGhost=(text,x,y)=>{
    const el=document.getElementById("drag-ghost"); if(el) el.remove();
    const g=document.createElement("div");
    g.id="drag-ghost"; g.textContent=text;
    Object.assign(g.style,{position:"fixed",zIndex:"9999",pointerEvents:"none",background:"#1A1612",color:"#F5F0E8",padding:"8px 14px",borderRadius:"8px",fontSize:"13px",boxShadow:"0 8px 24px rgba(0,0,0,0.35)",maxWidth:"200px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",transform:"translate(-50%,-50%)",left:x+"px",top:y+"px"});
    document.body.appendChild(g); ghostRef.current=g;
  };
  const moveGhost=(x,y)=>{ if(ghostRef.current){ghostRef.current.style.left=x+"px";ghostRef.current.style.top=y+"px";} };
  const removeGhost=()=>{ const el=document.getElementById("drag-ghost"); if(el) el.remove(); ghostRef.current=null; };
  const getHourAtPoint=(x,y)=>{ if(ghostRef.current) ghostRef.current.style.display="none"; const el=document.elementFromPoint(x,y); if(ghostRef.current) ghostRef.current.style.display=""; if(!el) return null; const row=el.closest("[data-hour]"); return row?parseInt(row.getAttribute("data-hour")):null; };

  const onTouchStartTask=(e,text,blockId=null,estMins=60)=>{ e.preventDefault(); dragInfo.current={text,blockId,estMins}; const t=e.touches[0]; createGhost(text,t.clientX,t.clientY); };
  const onTouchEnd=(e)=>{
    if(!dragInfo.current) return;
    const hour=hoverHour.current;
    if(hour!==null){ const{text,blockId,estMins}=dragInfo.current; const dH=Math.floor((estMins||60)/60),dM=(estMins||60)%60;
      if(blockId) setSchedule(p=>({...p,[selDay]:(p[selDay]||[]).map(b=>b.id!==blockId?b:{...b,startH:hour,startM:0})}));
      else addBlock(selDay,text,hour,0,dH,dM);
    }
    removeGhost(); dragInfo.current=null; hoverHour.current=null; setDropHint(null);
  };
  const onMouseDownTask=(e,text,blockId=null,estMins=60)=>{
    dragInfo.current={text,blockId,estMins}; createGhost(text,e.clientX,e.clientY);
    const onMove=(ev)=>{ moveGhost(ev.clientX,ev.clientY); const h=getHourAtPoint(ev.clientX,ev.clientY); hoverHour.current=h; setDropHint(h); };
    const onUp=()=>{
      const hour=hoverHour.current;
      if(hour!==null&&dragInfo.current){ const{text:t,blockId:bid,estMins:em}=dragInfo.current; const dH=Math.floor((em||60)/60),dM=(em||60)%60;
        if(bid) setSchedule(p=>({...p,[selDay]:(p[selDay]||[]).map(b=>b.id!==bid?b:{...b,startH:hour,startM:0})}));
        else addBlock(selDay,t,hour,0,dH,dM);
      }
      removeGhost(); dragInfo.current=null; hoverHour.current=null; setDropHint(null);
      window.removeEventListener("mousemove",onMove); window.removeEventListener("mouseup",onUp);
    };
    window.addEventListener("mousemove",onMove); window.addEventListener("mouseup",onUp);
  };

  useEffect(()=>{
    const onMove=(e)=>{ if(dragInfo.current){ e.preventDefault(); const t=e.touches[0]; moveGhost(t.clientX,t.clientY); const h=getHourAtPoint(t.clientX,t.clientY); hoverHour.current=h; setDropHint(h); }};
    const onEnd=(e)=>{ if(dragInfo.current) onTouchEnd(e); };
    window.addEventListener("touchmove",onMove,{passive:false});
    window.addEventListener("touchend",onEnd);
    window.addEventListener("touchcancel",onEnd);
    return ()=>{ window.removeEventListener("touchmove",onMove); window.removeEventListener("touchend",onEnd); window.removeEventListener("touchcancel",onEnd); };
  },[selDay,mk]);

  // ── BLOCK DRAG (move + resize) ────────────────────────────────────────────
  const snapToSlot = (mins) => Math.round(mins / 30) * 30; // snap to 30 min

  const startBlockDrag = (e, type, block) => {
    e.stopPropagation();
    e.preventDefault();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    blockDrag.current = {
      type, id: block.id, day: selDay,
      startY: clientY,
      origStartH: block.startH, origStartM: block.startM||0,
      origDurH: block.durH, origDurM: block.durM||0,
    };
    setDragBlockId(block.id);

    const onMove = (ev) => {
      if (!blockDrag.current) return;
      ev.preventDefault();
      const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
      const dy = cy - blockDrag.current.startY;
      const deltaMins = snapToSlot(dy / SLOT_H * 60);
      const { type, id, origStartH, origStartM, origDurH, origDurM } = blockDrag.current;

      if (type === "move") {
        const origTotalMins = origStartH * 60 + origStartM;
        const newTotalMins = Math.min(
          (HOUR_END) * 60,
          Math.max(HOUR_START * 60, origTotalMins + deltaMins)
        );
        const newH = Math.floor(newTotalMins / 60);
        const newM = newTotalMins % 60;
        setSchedule(p=>({...p,[selDay]:(p[selDay]||[]).map(b=>b.id!==id?b:{...b,startH:newH,startM:newM})}));
      } else {
        // resize: extend duration
        const origDurMins = origDurH * 60 + origDurM;
        const newDurMins = Math.max(30, snapToSlot(origDurMins + deltaMins));
        const newDurH = Math.floor(newDurMins / 60);
        const newDurM = newDurMins % 60;
        setSchedule(p=>({...p,[selDay]:(p[selDay]||[]).map(b=>b.id!==id?b:{...b,durH:newDurH,durM:newDurM})}));
      }
    };

    const onUp = () => {
      blockDrag.current = null;
      setDragBlockId(null);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend", onUp);
      window.removeEventListener("touchcancel", onUp);
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchmove", onMove, {passive:false});
    window.addEventListener("touchend", onUp);
    window.addEventListener("touchcancel", onUp);
  };

  // ── DERIVED ──
  const theme   = THEME_META[getDayTheme(selDay)] || THEME_META.free;
  const dayNote = note[selDay] || "";

  // ── NAV ──────────────────────────────────────────────────────────────────
  return (
    <div style={{fontFamily:"'Noto Serif TC',serif",background:"#F5F0E8",minHeight:"100dvh",color:"#1A1612"}}>

      {/* TOP NAV */}
      <div style={{background:"#1A1612",color:"#F5F0E8",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,0.3)"}}>
        {/* Month switcher */}
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <button onClick={()=>{ if(curM===1){setCurY(y=>y-1);setCurM(12);}else setCurM(m=>m-1); setSelDay(1); }} style={{background:"none",border:"none",color:"rgba(255,255,255,0.5)",fontSize:16,cursor:"pointer",padding:"2px 4px"}}>‹</button>
          <div style={{cursor:"pointer"}} onClick={()=>setEditMonthCfg(true)}>
            <div style={{fontSize:9,letterSpacing:3,color:"#C9A84C",fontFamily:"monospace"}}>{curY} · {MONTH_NAMES[curM-1]}</div>
            <div style={{fontSize:13,fontWeight:300}}>{cfg.name||MONTH_NAMES[curM-1]} <span style={{fontSize:9,color:"rgba(255,255,255,0.3)"}}>⚙</span></div>
          </div>
          <button onClick={()=>{ if(curM===12){setCurY(y=>y+1);setCurM(1);}else setCurM(m=>m+1); setSelDay(1); }} style={{background:"none",border:"none",color:"rgba(255,255,255,0.5)",fontSize:16,cursor:"pointer",padding:"2px 4px"}}>›</button>
        </div>
        {/* Tab buttons */}
        <div style={{display:"flex",gap:4}}>
          {[["calendar","🏠"],["today","☀️"],["cal","📅"],["goals","🎯"],["builds","🛠"]].map(([v,icon])=>(
            <button key={v} onClick={()=>setView(v)} style={{background:view===v?"#C9A84C":"rgba(255,255,255,0.1)",color:view===v?"#1A1612":"#F5F0E8",border:"none",borderRadius:6,padding:"5px 9px",fontSize:13,cursor:"pointer",transition:"all 0.2s"}}>{icon}</button>
          ))}
        </div>
      </div>


      {/* ══ DASHBOARD ══ */}
      {view==="calendar"&&<DashboardView
        curY={curY} curM={curM} mk={mk} cfg={cfg}
        totalDays={totalDays} todayD={todayD} isCurrentMonth={isCurrentMonth}
        MONTH_NAMES={MONTH_NAMES} THEME_META={THEME_META} PRIORITY={PRIORITY}
        getDayTheme={getDayTheme} getDayTasks={getDayTasks} done={done} getMeta={getMeta}
        daySchedule={daySchedule} goals={goals}
        setView={setView} setSelDay={setSelDay} setTasks={setTasks}
        setQuickForm={setQuickForm} setQuickAdd={setQuickAdd}
        quickAddToast={quickAddToast} setQuickAddToast={setQuickAddToast}
        getWeekday={getWeekday} isWeekend={isWeekend}
      />}

      {/* ══ FULL CALENDAR ══════════════════════════════════════════════════════ */}
      {view==="cal"&&(
        <div style={{padding:"10px 10px 0",display:"flex",flexDirection:"column",height:"calc(100dvh - 50px)"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:3,flexShrink:0}}>
            {["一","二","三","四","五","六","日"].map(d=>(
              <div key={d} style={{textAlign:"center",fontSize:11,fontFamily:"monospace",color:"#9C8070",padding:"2px 0"}}>{d}</div>
            ))}
          </div>
          <div style={{
            display:"grid",gridTemplateColumns:"repeat(7,1fr)",
            gridTemplateRows:`repeat(${Math.ceil((totalDays+(getWeekday(curY,curM,1)+6)%7)/7)},1fr)`,
            gap:3,flex:1,minHeight:0,
          }}>
            {Array.from({length:(getWeekday(curY,curM,1)+6)%7},(_,i)=><div key={`e${i}`}/>)}
            {Array.from({length:totalDays},(_,i)=>i+1).map(day=>{
              const th=getDayTheme(day);
              const meta=THEME_META[th]||THEME_META.free;
              const isSel=day===selDay,isToday=isCurrentMonth&&day===todayD;
              const dayTasks=getDayTasks(day);
              const comp=dayTasks.filter((_,i)=>done[`${day}-${i}`]).length;
              const total=dayTasks.length;
              const sched=daySchedule(day).length;
              const weekend=isWeekend(curY,curM,day);
              return(
                <div key={day} onClick={()=>{setSelDay(day);setCalMode("day");setView("today");}}
                  style={{background:isSel?meta.color:weekend?"transparent":meta.bg,border:isToday?`2px solid ${meta.color}`:`1px solid ${weekend?"transparent":meta.color+"20"}`,borderRadius:8,padding:"5px 4px",cursor:"pointer",color:isSel?"#fff":"#1A1612",display:"flex",flexDirection:"column",gap:2,overflow:"hidden",minHeight:0,transition:"transform 0.1s,box-shadow 0.1s"}}
                  onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-1px)";e.currentTarget.style.boxShadow=`0 4px 10px ${meta.color}30`;}}
                  onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}
                >
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontFamily:"monospace",fontSize:11,fontWeight:700,background:isToday&&!isSel?meta.color:"transparent",color:isToday&&!isSel?"#fff":(isSel?"#fff":meta.color),borderRadius:4,padding:isToday&&!isSel?"1px 4px":"0"}}>{day}</span>
                    {!weekend&&<span style={{fontSize:11,opacity:0.8}}>{meta.icon}</span>}
                  </div>
                  {!weekend&&(
                    <div style={{display:"flex",flexWrap:"wrap",gap:2,marginTop:1}}>
                      {dayTasks.slice(0,4).map((_,i)=>{
                        const isDone=!!done[`${day}-${i}`];
                        const pColor=PRIORITY[getMeta(day,i).priority]?.color||"#aaa";
                        return <span key={i} style={{width:5,height:5,borderRadius:"50%",background:isDone?"#ddd":(isSel?"rgba(255,255,255,0.7)":pColor),opacity:isDone?0.4:1,flexShrink:0}}/>;
                      })}
                      {total>4&&<span style={{fontSize:7,color:isSel?"rgba(255,255,255,0.6)":meta.color,lineHeight:"5px"}}>+{total-4}</span>}
                    </div>
                  )}
                  {!weekend&&total>0&&sched>0&&<div style={{fontSize:7,color:isSel?"rgba(255,255,255,0.6)":meta.color,marginTop:1}}>⏰{sched}</div>}
                </div>
              );
            })}
          </div>
          {/* Legend */}
          <div style={{padding:"6px 2px 8px",flexShrink:0,display:"flex",flexWrap:"wrap",gap:6}}>
            {Object.entries(THEME_META).map(([k,m])=>(
              <div key={k} style={{display:"flex",alignItems:"center",gap:3,fontSize:10,fontFamily:"monospace",color:"#9C8070"}}>
                <div style={{width:7,height:7,borderRadius:2,background:m.bg,border:`1.5px solid ${m.color}80`}}/>
                {m.icon}{m.label}
              </div>
            ))}
          </div>
        </div>
      )}


      {/* ══ TODAY ══ */}
      {view==="today"&&<TodayView
        curY={curY} curM={curM} selDay={selDay} setSelDay={setSelDay}
        totalDays={totalDays} todayD={todayD} isCurrentMonth={isCurrentMonth}
        theme={theme} dayNote={dayNote} setNote={setNote}
        getDayTheme={getDayTheme} getDayTasks={getDayTasks} done={done} getMeta={getMeta}
        daySchedule={daySchedule} addBlock={addBlock} removeBlock={removeBlock}
        openEditBlock={openEditBlock} openEditTask={openEditTask}
        toggleDone={toggleDone} isMobile={isMobile}
        calMode={calMode} setCalMode={setCalMode}
        THEME_META={THEME_META} WEEKDAY_NAMES={WEEKDAY_NAMES}
        HOURS={HOURS} HOUR_START={HOUR_START} HOUR_END={HOUR_END} SLOT_H={SLOT_H} fmt={fmt}
        PRIORITY={PRIORITY} EST_OPTIONS={EST_OPTIONS}
        setQuickForm={setQuickForm} setQuickAdd={setQuickAdd}
        setEditMeta={setEditMeta} startBlockDrag={startBlockDrag}
        dragBlockId={dragBlockId} dropHint={dropHint}
        onTouchStartTask={onTouchStartTask} onMouseDownTask={onMouseDownTask}
        WeekView={WeekView}
      />}

      {/* ══ GOALS ══════════════════════════════════════════════════════════════ */}
      {view==="goals"&&(
        <div style={{padding:"14px"}}>
          <div style={{marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{fontSize:10,fontFamily:"monospace",color:"#888",letterSpacing:1}}>點 +/− 更新進度</span>
            <button onClick={openAddGoal} style={{background:"#1A1612",color:"#C9A84C",border:"none",borderRadius:7,padding:"7px 13px",fontSize:11,fontFamily:"monospace",cursor:"pointer"}}>＋ 新增目標</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {goals.map(g=>{
              const pct=Math.min(100,(g.count/g.target)*100),full=pct>=100;
              return <div key={g.id} style={{background:full?"#F0F8F0":"#fff",borderRadius:11,border:full?"1px solid #7A9E7E40":"1px solid #e8e4de",padding:"13px 14px",display:"flex",alignItems:"center",gap:11}}>
                <span style={{fontSize:22,cursor:"pointer"}} onClick={()=>openEditGoal(g)}>{g.icon}</span>
                <div style={{flex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{fontSize:13,fontWeight:600}}>{g.name}</span>
                      <span style={{fontSize:9,fontFamily:"monospace",background:g.scope==="longterm"?"#1A1612":"#e8f4e8",color:g.scope==="longterm"?"#C9A84C":"#7A9E7E",padding:"1px 5px",borderRadius:6}}>{g.scope==="longterm"?"長期":"月度"}</span>
                      <button onClick={()=>openEditGoal(g)} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,color:"#ccc",padding:0}}>✏️</button>
                    </div>
                    <span style={{fontSize:11,fontFamily:"monospace",color:full?"#7A9E7E":"#C9A84C"}}>{g.count}/{g.target} {g.unit}</span>
                  </div>
                  <div style={{background:"#f0ede8",borderRadius:5,height:5}}>
                    <div style={{background:full?"#7A9E7E":"#C9A84C",borderRadius:5,height:"100%",width:`${pct}%`,transition:"width 0.4s"}}/>
                  </div>
                  <div style={{fontSize:8,fontFamily:"monospace",color:"#aaa",marginTop:2}}>{Math.round(pct)}%{full&&" ✅ 達標！"}</div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {[["＋",1],["－",-1]].map(([l,d])=><button key={l} onClick={()=>bumpGoal(g.id,d)} style={{width:30,height:30,borderRadius:6,background:d>0?"#C9A84C":"#f0ede8",color:d>0?"#fff":"#888",border:"none",fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{l}</button>)}
                </div>
              </div>;
            })}
          </div>
          <div style={{background:"#1A1612",color:"#F5F0E8",borderRadius:11,padding:"14px",marginTop:14}}>
            <div style={{fontSize:9,fontFamily:"monospace",letterSpacing:2,color:"#C9A84C",marginBottom:9}}>PROGRESS</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {goals.map(g=>{const pct=Math.min(100,(g.count/g.target)*100);return <div key={g.id} style={{textAlign:"center",flex:1,minWidth:46}}><div style={{fontSize:17,marginBottom:2}}>{g.icon}</div><div style={{fontSize:10,fontFamily:"monospace",color:"#C9A84C"}}>{Math.round(pct)}%</div><div style={{fontSize:8,color:"rgba(245,240,232,0.4)",fontFamily:"monospace"}}>{g.name.slice(0,4)}</div></div>;})}
            </div>
          </div>
        </div>
      )}

      {/* ══ BUILDS ════════════════════════════════════════════════════════════ */}

      {/* ══ BUILDS ══ */}
      {view==="builds"&&<BuildsView
        builds={builds} setBuilds={setBuilds} selDay={selDay} mk={mk}
        curM={curM} uid={uid} setEditBuild={setEditBuild}
        THEME_META={THEME_META} getDayTheme={getDayTheme}
        WEEKDAY_NAMES={WEEKDAY_NAMES} getWeekday={getWeekday} curY={curY}
      />}

      {/* ══ MODAL: month config ════════════════════════════════════════════════ */}
      {editMonthCfg&&(
        <Modal onClose={()=>setEditMonthCfg(false)}>
          <div style={{fontSize:10,fontFamily:"monospace",letterSpacing:2,color:"#888",marginBottom:14}}>月份設定 · {curY}/{curM}</div>

          {/* Name */}
          <div style={{marginBottom:12}}>
            <Label>月份名稱（選填）</Label>
            <input value={cfg.name||""} onChange={e=>saveCfgPatch({name:e.target.value})} placeholder="例：新工作第一個月" style={inputStyle}/>
          </div>

          {/* Weekday themes */}
          <div style={{marginBottom:14}}>
            <Label>平日主題設定</Label>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {[1,2,3,4,5].map(wd=>{
                const wdName=["","一","二","三","四","五"][wd];
                const cur=cfg.wdTheme?.[wd]||"free";
                return <div key={wd} style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:11,fontFamily:"monospace",color:"#888",width:20}}>週{wdName}</span>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap",flex:1}}>
                    {["brain","body","life","focus","work","free"].map(th=>{
                      const m=THEME_META[th];
                      const isSel=cur===th;
                      return <button key={th} onClick={()=>saveCfgPatch({wdTheme:{...cfg.wdTheme,[wd]:th}})}
                        style={{padding:"3px 8px",borderRadius:6,border:`1.5px solid ${isSel?m.color:"#e8e4de"}`,background:isSel?m.bg:"#fff",color:isSel?m.color:"#888",fontSize:10,fontFamily:"monospace",cursor:"pointer"}}>
                        {m.icon} {m.label}
                      </button>;
                    })}
                  </div>
                </div>;
              })}
            </div>
          </div>

          {/* Special days */}
          <div style={{marginBottom:16}}>
            <Label>特殊日設定（點日期 → 選類型）</Label>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
              {Array.from({length:totalDays},(_,i)=>i+1).filter(d=>!isWeekend(curY,curM,d)).map(d=>{
                const sp=cfg.specialDays?.[d];
                const m=sp?THEME_META[sp]:null;
                return <button key={d} onClick={()=>{
                  const opts=["work","travel","event",null];
                  const cur=cfg.specialDays?.[d]||null;
                  const next=opts[(opts.indexOf(cur)+1)%opts.length];
                  const nd={...cfg.specialDays};
                  if(next) nd[d]=next; else delete nd[d];
                  saveCfgPatch({specialDays:nd});
                }} style={{minWidth:28,height:28,borderRadius:5,background:m?m.bg:"#f5f2ee",border:`1.5px solid ${m?m.color:"#e8e4de"}`,color:m?m.color:"#aaa",fontSize:10,fontFamily:"monospace",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:2}}>
                  {m&&<span style={{fontSize:11}}>{m.icon}</span>}{d}
                </button>;
              })}
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {["work","travel","event"].map(t=>{const m=THEME_META[t];return <div key={t} style={{fontSize:10,fontFamily:"monospace",color:m.color,display:"flex",alignItems:"center",gap:3}}><span>{m.icon}</span>{m.label}</div>;})}
              <div style={{fontSize:10,fontFamily:"monospace",color:"#aaa"}}>（再點一次取消）</div>
            </div>
          </div>

          <button onClick={()=>setEditMonthCfg(false)} style={{...saveBtnStyle,width:"100%"}}>完成 ✓</button>
        </Modal>
      )}

      {/* ══ MODAL: edit task list ════════════════════════════════════════════ */}
      {editDay!==null&&<Modal onClose={()=>setEditDay(null)}>
        <div style={{fontSize:10,fontFamily:"monospace",letterSpacing:2,color:"#888",marginBottom:8}}>編輯 {curM}/{editDay} 任務</div>
        <div style={{fontSize:11,color:"#aaa",marginBottom:8,fontFamily:"monospace"}}>每行一個任務，可加 emoji</div>
        <textarea autoFocus value={editText} onChange={e=>setEditText(e.target.value)} style={{width:"100%",height:150,padding:"10px",borderRadius:8,border:"1.5px solid #e8e4de",fontFamily:"'Noto Serif TC',serif",fontSize:14,background:"#fff",color:"#1A1612",outline:"none",resize:"none",lineHeight:1.8}}/>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <button onClick={()=>setEditDay(null)} style={cancelBtnStyle}>取消</button>
          <button onClick={saveEditTask} style={saveBtnStyle}>儲存 ✓</button>
        </div>
      </Modal>}

      {/* ══ MODAL: edit block ════════════════════════════════════════════════ */}
      {editBlock!==null&&<Modal onClose={()=>setEditBlock(null)}>
        <div style={{fontSize:10,fontFamily:"monospace",letterSpacing:2,color:"#888",marginBottom:12}}>編輯行程</div>
        <div style={{marginBottom:10}}><Label>任務名稱</Label><input value={editBlockForm.taskText} onChange={e=>setEditBlockForm(f=>({...f,taskText:e.target.value}))} style={inputStyle}/></div>
        <div style={{display:"flex",gap:10,marginBottom:10}}>
          <div style={{flex:1}}><Label>開始時間</Label>
            <div style={{display:"flex",gap:4,alignItems:"center"}}>
              <input type="number" min={HOUR_START} max={HOUR_END} value={editBlockForm.startH} onChange={e=>setEditBlockForm(f=>({...f,startH:e.target.value}))} style={{...inputStyle,textAlign:"center",padding:"8px 4px"}}/>
              <span style={{color:"#aaa",fontWeight:600}}>:</span>
              <select value={editBlockForm.startM} onChange={e=>setEditBlockForm(f=>({...f,startM:e.target.value}))} style={{...inputStyle,textAlign:"center",padding:"8px 4px",cursor:"pointer"}}><option value="0">00</option><option value="30">30</option></select>
            </div>
          </div>
        </div>
        <div style={{marginBottom:18}}><Label>時長（30 分鐘為單位）</Label>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
            {[{label:"30分",durH:0,durM:30},{label:"1小時",durH:1,durM:0},{label:"1.5hr",durH:1,durM:30},{label:"2小時",durH:2,durM:0},{label:"2.5hr",durH:2,durM:30},{label:"3小時",durH:3,durM:0},{label:"4小時",durH:4,durM:0},{label:"自訂",durH:null}].map(opt=>{
              const isSel=opt.durH!==null&&parseInt(editBlockForm.durH)===opt.durH&&parseInt(editBlockForm.durM||0)===opt.durM;
              return <button key={opt.label} onClick={()=>opt.durH!==null?setEditBlockForm(f=>({...f,durH:String(opt.durH),durM:String(opt.durM)})):setEditBlockForm(f=>({...f,durH:"",durM:"0"}))} style={{padding:"8px 4px",borderRadius:7,border:`1.5px solid ${isSel?theme.color:"#e8e4de"}`,background:isSel?theme.bg:"#fff",color:isSel?theme.color:"#666",fontSize:11,fontFamily:"monospace",cursor:"pointer",fontWeight:isSel?700:400}}>{opt.label}</button>;
            })}
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setEditBlock(null)} style={cancelBtnStyle}>取消</button>
          <button onClick={saveEditBlock} style={saveBtnStyle}>儲存 ✓</button>
        </div>
      </Modal>}

      {/* ══ MODAL: task priority/est ═════════════════════════════════════════ */}
      {editMeta!==null&&<EditMetaContent editMeta={editMeta} getMeta={getMeta} getDayTasks={getDayTasks} setMeta={setMeta} setEditMeta={setEditMeta} theme={theme} PRIORITY={PRIORITY} EST_OPTIONS={EST_OPTIONS} inputStyle={inputStyle} saveBtnStyle={saveBtnStyle}/>}
      {/* ══ MODAL: goal edit ═════════════════════════════════════════════════ */}
      {editGoalId!==null&&<Modal onClose={()=>setEditGoalId(null)}>
        <div style={{fontSize:10,fontFamily:"monospace",letterSpacing:2,color:"#888",marginBottom:14}}>{editGoalId==="__new__"?"新增目標":"編輯目標"}</div>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:"0 0 58px"}}><Label>ICON</Label><input value={editGoalForm.icon} onChange={e=>setEditGoalForm(f=>({...f,icon:e.target.value}))} style={{...inputStyle,fontSize:22,textAlign:"center",padding:"6px"}}/></div>
          <div style={{flex:1}}><Label>名稱</Label><input autoFocus={editGoalId==="__new__"} value={editGoalForm.name} onChange={e=>setEditGoalForm(f=>({...f,name:e.target.value}))} placeholder="目標名稱" style={inputStyle}/></div>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:1}}><Label>目標數量</Label><input type="number" min="1" value={editGoalForm.target} onChange={e=>setEditGoalForm(f=>({...f,target:e.target.value}))} style={inputStyle}/></div>
          <div style={{flex:1}}><Label>單位</Label><input value={editGoalForm.unit} onChange={e=>setEditGoalForm(f=>({...f,unit:e.target.value}))} placeholder="次/本/件" style={inputStyle}/></div>
        </div>
        <div style={{marginBottom:18}}><Label>類型</Label>
          <div style={{display:"flex",gap:8}}>
            {[["month","月度目標","每月重設"],["longterm","長期目標","持續累積"]].map(([s,l,sub])=>{
              const isSel=editGoalForm.scope===s;
              return <button key={s} onClick={()=>setEditGoalForm(f=>({...f,scope:s}))} style={{flex:1,padding:"10px 8px",borderRadius:9,border:`2px solid ${isSel?"#1A1612":"#e8e4de"}`,background:isSel?"#1A1612":"#fff",color:isSel?"#C9A84C":"#666",cursor:"pointer",textAlign:"center"}}>
                <div style={{fontSize:12,fontWeight:600,marginBottom:2}}>{l}</div>
                <div style={{fontSize:10,opacity:0.7,fontFamily:"monospace"}}>{sub}</div>
              </button>;
            })}
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          {editGoalId!=="__new__"&&<button onClick={()=>deleteGoal(editGoalId)} style={{flex:"0 0 42px",padding:"11px",borderRadius:8,border:"1px solid #f0ddd8",background:"#FFF5F3",color:"#C4714A",fontSize:15,cursor:"pointer"}}>🗑</button>}
          <button onClick={()=>setEditGoalId(null)} style={cancelBtnStyle}>取消</button>
          <button onClick={saveGoalEdit} style={saveBtnStyle}>儲存 ✓</button>
        </div>
      </Modal>}

      {/* ══ MODAL: goal link ═════════════════════════════════════════════════ */}
      {goalLink!==null&&(
        <div style={{position:"fixed",inset:0,background:"rgba(26,22,18,0.65)",backdropFilter:"blur(4px)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:500}} onClick={e=>e.target===e.currentTarget&&setGoalLink(null)}>
          <div style={{background:"#FAF8F4",borderRadius:"16px 16px 0 0",padding:"22px 18px 28px",width:"100%",maxWidth:480,boxShadow:"0 -8px 40px rgba(0,0,0,0.2)"}}>
            <div style={{fontSize:10,fontFamily:"monospace",letterSpacing:2,color:"#888",marginBottom:6}}>✅ 完成任務</div>
            <div style={{fontSize:14,fontWeight:600,marginBottom:4,color:"#1A1612"}}>{goalLink.taskName}</div>
            <div style={{fontSize:12,color:"#888",marginBottom:16}}>要記進哪個目標的進度？</div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
              {goals.map(g=>{
                const pct=Math.min(100,(g.count/g.target)*100);
                return <button key={g.id} onClick={()=>{bumpGoal(g.id,1);setGoalLink(null);}} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",borderRadius:10,border:"1.5px solid #e8e4de",background:"#fff",cursor:"pointer",textAlign:"left",transition:"all 0.15s"}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor="#C9A84C";e.currentTarget.style.background="#FFF8E8";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#e8e4de";e.currentTarget.style.background="#fff";}}>
                  <span style={{fontSize:20}}>{g.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:13,fontWeight:600}}>{g.name}</span><span style={{fontSize:11,fontFamily:"monospace",color:"#C9A84C"}}>{g.count}/{g.target} {g.unit}</span></div>
                    <div style={{background:"#f0ede8",borderRadius:4,height:3}}><div style={{background:"#C9A84C",borderRadius:4,height:"100%",width:`${pct}%`}}/></div>
                  </div>
                </button>;
              })}
            </div>
            <button onClick={()=>setGoalLink(null)} style={{width:"100%",padding:"11px",borderRadius:9,border:"1px solid #e8e4de",background:"transparent",fontSize:13,color:"#888",cursor:"pointer"}}>不用，跳過</button>
          </div>
        </div>
      )}

      {/* ══ MODAL: build edit ════════════════════════════════════════════════ */}
      {editBuild!==null&&<EditBuildContent editBuild={editBuild} setEditBuild={setEditBuild} builds={builds} setBuilds={setBuilds} cancelBtnStyle={cancelBtnStyle} saveBtnStyle={saveBtnStyle} inputStyle={inputStyle} uid={uid}/>}


    </div>
  );
}

// ── SHARED ────────────────────────────────────────────────────────────────
const Modal=({children,onClose})=>(
  <div style={{position:"fixed",inset:0,background:"rgba(26,22,18,0.72)",backdropFilter:"blur(4px)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:500}} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{background:"#FAF8F4",borderRadius:"16px 16px 0 0",padding:"22px 18px",width:"100%",maxWidth:480,boxShadow:"0 -8px 40px rgba(0,0,0,0.25)",maxHeight:"88vh",overflowY:"auto"}}>{children}</div>
  </div>
);
const Label=({children})=><div style={{fontSize:9,fontFamily:"monospace",color:"#aaa",marginBottom:3,letterSpacing:0.5}}>{children}</div>;
const inputStyle={width:"100%",padding:"9px 11px",borderRadius:7,border:"1.5px solid #e8e4de",fontSize:14,fontFamily:"'Noto Serif TC',serif",background:"#fff",color:"#1A1612",outline:"none"};
const cancelBtnStyle={flex:1,padding:"11px",borderRadius:8,border:"1px solid #e8e4de",background:"transparent",fontSize:13,cursor:"pointer",color:"#888"};
const saveBtnStyle={flex:2,padding:"11px",borderRadius:8,border:"none",background:"#1A1612",color:"#F5F0E8",fontSize:13,cursor:"pointer",fontWeight:600};

// ── SHARED ─

const Modal=({children,onClose})=>(
  <div style={{position:"fixed",inset:0,background:"rgba(61,43,31,0.55)",backdropFilter:"blur(8px)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:500}} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{background:"#FDFAF6",borderRadius:"18px 18px 0 0",padding:"24px 20px",width:"100%",maxWidth:480,boxShadow:"0 -12px 40px rgba(61,43,31,0.15)",maxHeight:"88vh",overflowY:"auto"}}>{children}</div>
  </div>
);
const Label=({children})=><div style={{fontSize:10,fontFamily:"monospace",color:"#9C8070",marginBottom:4,letterSpacing:"0.8px",fontWeight:500,textTransform:"uppercase"}}>{children}</div>;
const inputStyle={width:"100%",padding:"10px 13px",borderRadius:10,border:"1.5px solid #E8DDD4",fontSize:14,fontFamily:"'Noto Serif TC',serif",background:"#FDFAF6",color:"#3D2B1F",outline:"none"};
const cancelBtnStyle={flex:1,padding:"12px",borderRadius:12,border:"1px solid #E8DDD4",background:"transparent",fontSize:13,cursor:"pointer",color:"#9C8070"};
const saveBtnStyle={flex:2,padding:"12px",borderRadius:12,border:"none",background:"#C4855A",color:"#fff",fontSize:13,cursor:"pointer",fontWeight:600};
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

</script>

</body>
</html>
