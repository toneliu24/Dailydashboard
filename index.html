<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的月曆">
<meta name="theme-color" content="#FBF7F2">
<title>我的月曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#F2EDE6; overscroll-behavior:none; font-family:'Noto Serif TC',serif; }
#root { min-height:100dvh; padding-top:env(safe-area-inset-top); }
button:focus { outline:none; }
input:focus { outline:none; }
textarea:focus { outline:none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
// ─────────────────────────────────────────────────────────
// DAILY DASHBOARD — No-compile React.createElement version
// ─────────────────────────────────────────────────────────
const {useState,useEffect,useRef,useCallback} = React;
const h = React.createElement;
const r = (tag,props,...ch) => h(tag,props,...ch.flat());

// ── COLORS ──────────────────────────────────────────────
const C = {
  bg:"#F2EDE6", card:"#FDFAF6", ink:"#3D2B1F",
  sub:"#9C8070", border:"#E8DDD4", accent:"#C4855A",
  gold:"#C9A84C", nav:"#FBF7F2",
};

// ── THEME ────────────────────────────────────────────────
const THEMES = {
  work:    {label:"上班",   color:"#B85C38", bg:"#FAE8DC", icon:"🏢"},
  travel:  {label:"旅行",   color:"#3A78A0", bg:"#E0EEF5", icon:"✈️"},
  event:   {label:"活動",   color:"#7B5EA7", bg:"#EFE8F8", icon:"🌱"},
  brain:   {label:"大腦日", color:"#C9A84C", bg:"#FFF8E8", icon:"📚"},
  body:    {label:"身體日", color:"#7A9E7E", bg:"#EEF4EE", icon:"💪"},
  life:    {label:"生活日", color:"#C4714A", bg:"#FBF0EA", icon:"🛋"},
  focus:   {label:"專注日", color:"#5B8FBF", bg:"#EAF2FA", icon:"🎯"},
  free:    {label:"自由日", color:"#A0886A", bg:"#F5F0E8", icon:"🌿"},
  weekend: {label:"週末",   color:"#888",    bg:"#F0EDE8", icon:"☕"},
};
const PRIORITY = {
  must:   {label:"Must",   color:"#E53E3E", bg:"#FFF0F0", dot:"🔴"},
  should: {label:"Should", color:"#C9A84C", bg:"#FFFBF0", dot:"🟡"},
  nice:   {label:"Nice",   color:"#aaa",    bg:"#F8F8F8", dot:"⚪"},
};
const MONTH_NAMES=["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
const WD_NAMES=["日","一","二","三","四","五","六"];

// ── UTILS ────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,8);
const fmt = (h,m=0) => String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
const getWD = (y,m,d) => new Date(y,m-1,d).getDay();
const daysIn = (y,m) => new Date(y,m,0).getDate();
const isWE = (y,m,d) => [0,6].includes(getWD(y,m,d));
const mkey = (y,m) => `${y}-${String(m).padStart(2,"0")}`;

// ── STORAGE ──────────────────────────────────────────────
const SK = "dashboard-v6";
const load = async () => {
  try { const v=localStorage.getItem(SK); return v?JSON.parse(v):null; } catch(_){ return null; }
};
const save = (d) => { try { localStorage.setItem(SK,JSON.stringify(d)); } catch(_){} };

// ── JUNE 2026 DEFAULTS ───────────────────────────────────
const JUNE_CFG = {
  name:"充電的六月",
  wdTheme:{1:"brain",2:"body",3:"brain",4:"body",5:"life"},
  specialDays:{3:"work",9:"event",11:"travel",12:"travel",13:"travel",14:"travel",15:"travel",16:"work",18:"work",23:"work"},
};
const JUNE_TASKS = {
  2:["📚 開始第一本書","🤖 AI CoWork 工具研究"],
  3:["🏢 舊公司事務"],4:["🤖 AI Workflow 實作","📚 讀書 40 頁"],
  5:["🚗 練車 2hr","💪 傍晚運動"],6:["🛋 家具清單整理","📚 讀書 40 頁"],
  9:["🌱 新公司活動 — 觀察、建立關係"],10:["📚 完成第一本書","🤖 AI 工具深化"],
  11:["✈️ 出發！放空模式開啟"],12:["✈️ 探索 Day 2"],13:["✈️ 放鬆 Day 3"],
  14:["✈️ Day 4"],15:["✈️ 回程 Day 5"],16:["🏢 舊公司事務"],
  17:["🚗 練車（輕鬆）","📚 開始第三本書"],18:["🏢 舊公司交接"],
  19:["🚗 練車 2hr","💪 運動"],20:["🛋 家具採購實地","📚 讀書下午"],
  23:["🏢 最後一天上班 🎉"],24:["🤖 AI CoWork 總整理","📚 第四本書"],
  25:["🚗 練車考前衝刺","🏢 新工作產業研究"],26:["🏢 新工作知識整理","💪 運動"],
  27:["🛋 家具到貨確認","📚 第五本書開始"],30:["✅ 月底回顧","📚 完成第五本書"],
};
const GOALS_INIT = [
  {id:"book",icon:"📚",name:"五本書",target:5,unit:"本",count:0,scope:"month"},
  {id:"drive",icon:"🚗",name:"練開車",target:12,unit:"次",count:0,scope:"month"},
  {id:"sport",icon:"💪",name:"運動習慣",target:12,unit:"次",count:0,scope:"month"},
  {id:"ai",icon:"🤖",name:"AI CoWork",target:8,unit:"次",count:0,scope:"month"},
  {id:"newjob",icon:"🏢",name:"新工作準備",target:10,unit:"篇",count:0,scope:"month"},
  {id:"furniture",icon:"🛋",name:"家具採購",target:3,unit:"件",count:0,scope:"month"},
];

const SLOT_H=60,HOUR_START=6,HOUR_END=23;
const HOURS=Array.from({length:HOUR_END-HOUR_START+1},(_,i)=>HOUR_START+i);

// ── STYLE HELPERS ─────────────────────────────────────────
const s = o => o; // passthrough for style objects
const btn = (onClick,style,children) => h('button',{onClick,style:{fontFamily:"inherit",cursor:"pointer",border:"none",...style}},children);
const inp = (props) => h('input',{style:{fontFamily:"inherit",width:"100%",...props.style},...props});

// ── MAIN APP ─────────────────────────────────────────────
function App() {
  const now = new Date();
  const todayY=now.getFullYear(), todayM=now.getMonth()+1, todayD=now.getDate();

  const [curY,setCurY] = useState(todayY);
  const [curM,setCurM] = useState(todayM);
  const mk = mkey(curY,curM);
  const isCurMonth = curY===todayY && curM===todayM;
  const totalDays = daysIn(curY,curM);

  const [allConfigs,setAllConfigs] = useState({"2026-06":JUNE_CFG});
  const cfg = allConfigs[mk]||{name:"",wdTheme:{1:"brain",2:"body",3:"brain",4:"body",5:"life"},specialDays:{}};

  const [allData,setAllData] = useState({"2026-06":{tasks:{...JUNE_TASKS},done:{},schedule:{},note:{},taskMeta:{}}});
  const md = allData[mk]||{tasks:{},done:{},schedule:{},note:{},taskMeta:{}};
  const patch = p => setAllData(prev=>({...prev,[mk]:{...md,...p}}));

  const tasks    = md.tasks||{};
  const done     = md.done||{};
  const schedule = md.schedule||{};
  const note     = md.note||{};
  const taskMeta = md.taskMeta||{};

  const setTasks    = fn => patch({tasks: typeof fn==="function"?fn(tasks):fn});
  const setDone     = fn => patch({done: typeof fn==="function"?fn(done):fn});
  const setSchedule = fn => patch({schedule: typeof fn==="function"?fn(schedule):fn});
  const setNote     = fn => patch({note: typeof fn==="function"?fn(note):fn});
  const setTaskMeta = fn => patch({taskMeta: typeof fn==="function"?fn(taskMeta):fn});

  const [goals,setGoals]   = useState(GOALS_INIT);
  const [builds,setBuilds] = useState([]);
  const [view,setView]     = useState("dash");
  const [selDay,setSelDay] = useState(isCurMonth?todayD:1);
  const [loaded,setLoaded] = useState(false);
  const [isMobile,setIsMobile] = useState(window.innerWidth<640);

  // Modals
  const [modal,setModal] = useState(null); // {type, ...data}
  const [toast,setToast] = useState("");

  // Drag
  const ghostRef = useRef(null);
  const dragRef  = useRef(null);
  const hoverH   = useRef(null);
  const [dropHint,setDropHint] = useState(null);
  const [dragBlockId,setDragBlockId] = useState(null);

  // ── LOAD/SAVE ──
  const latest = useRef({allData,goals,builds,allConfigs});
  useEffect(()=>{ latest.current={allData,goals,builds,allConfigs}; });

  useEffect(()=>{
    load().then(d=>{
      if(d){
        if(d.allData)    setAllData(d.allData);
        if(d.goals)      setGoals(d.goals);
        if(d.builds)     setBuilds(d.builds);
        if(d.allConfigs) setAllConfigs(d.allConfigs);
      }
      setLoaded(true);
    });
    const onUnload=()=>save(latest.current);
    window.addEventListener("beforeunload",onUnload);
    document.addEventListener("visibilitychange",()=>{
      if(document.visibilityState==="hidden") save(latest.current);
    });
    return ()=>window.removeEventListener("beforeunload",onUnload);
  },[]);

  const saveTimer=useRef(null);
  useEffect(()=>{
    if(!loaded) return;
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>save({allData,goals,builds,allConfigs}),800);
  },[allData,goals,builds,allConfigs,loaded]);

  useEffect(()=>{
    const fn=()=>setIsMobile(window.innerWidth<640);
    window.addEventListener("resize",fn);
    return ()=>window.removeEventListener("resize",fn);
  },[]);

  // ── HELPERS ──
  const getDayTheme = d => {
    if(isWE(curY,curM,d)) return "weekend";
    const sp=cfg.specialDays[d]; if(sp) return sp;
    const wd=getWD(curY,curM,d);
    return cfg.wdTheme[wd]||"free";
  };
  const getTasks    = d => tasks[d]||[];
  const getSched    = d => schedule[d]||[];
  const getMeta     = (d,i) => taskMeta[d+"-"+i]||{priority:"nice",estMins:60};
  const setMeta     = (d,i,patch2) => setTaskMeta(p=>({...p,[d+"-"+i]:{...getMeta(d,i),...patch2}}));
  const compCount   = d => getTasks(d).filter((_,i)=>done[d+"-"+i]).length;

  const toggleDone = (d,i) => {
    const key=d+"-"+i;
    const wasUndone=!done[key];
    setDone(p=>({...p,[key]:wasUndone}));
    if(wasUndone) setModal({type:"goallink",taskName:getTasks(d)[i]});
  };

  const addBlock=(d,text,startH,startM=0,durH=1,durM=0)=>
    setSchedule(p=>({...p,[d]:[...(p[d]||[]),{id:uid(),taskText:text,startH,startM,durH,durM}]}));
  const removeBlock=(d,id)=>setSchedule(p=>({...p,[d]:(p[d]||[]).filter(b=>b.id!==id)}));

  const showToast = (msg,ms=2000) => {
    setToast(msg);
    setTimeout(()=>setToast(""),ms);
  };

  const quickAddTask = (d, text) => {
    if(!text.trim()) return;
    setTasks(p=>({...p,[d]:[...(p[d]||[]),text.trim()]}));
    showToast("✅ 已加到 "+curM+"/"+d);
  };

  // ── DRAG (block move/resize) ──
  const blockDragRef = useRef(null);

  const startBlockDrag = (e,type,block) => {
    e.stopPropagation(); e.preventDefault();
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    blockDragRef.current={type,id:block.id,day:selDay,startY:cy,
      origH:block.startH,origM:block.startM||0,origDH:block.durH,origDM:block.durM||0};
    setDragBlockId(block.id);
    const snap=mins=>Math.round(mins/30)*30;
    const onMove=ev=>{
      if(!blockDragRef.current) return;
      ev.preventDefault();
      const cy2=ev.touches?ev.touches[0].clientY:ev.clientY;
      const dy=cy2-blockDragRef.current.startY;
      const dMins=snap(dy/SLOT_H*60);
      const {type:tp,id,origH,origM,origDH,origDM}=blockDragRef.current;
      if(tp==="move"){
        const tot=Math.min(HOUR_END*60,Math.max(HOUR_START*60,origH*60+origM+dMins));
        const nH=Math.floor(tot/60),nM=tot%60;
        setSchedule(p=>({...p,[selDay]:(p[selDay]||[]).map(b=>b.id!==id?b:{...b,startH:nH,startM:nM})}));
      } else {
        const newDur=Math.max(30,snap(origDH*60+origDM+dMins));
        setSchedule(p=>({...p,[selDay]:(p[selDay]||[]).map(b=>b.id!==id?b:{...b,durH:Math.floor(newDur/60),durM:newDur%60})}));
      }
    };
    const onUp=()=>{
      blockDragRef.current=null; setDragBlockId(null);
      window.removeEventListener("mousemove",onMove); window.removeEventListener("mouseup",onUp);
      window.removeEventListener("touchmove",onMove); window.removeEventListener("touchend",onUp);
    };
    window.addEventListener("mousemove",onMove); window.addEventListener("mouseup",onUp);
    window.addEventListener("touchmove",onMove,{passive:false}); window.addEventListener("touchend",onUp);
  };

  // ── THEME ──
  const theme = THEMES[getDayTheme(selDay)]||THEMES.free;

  // ── NAV ──
  const NAV = h('div',{style:{background:C.ink,color:"#F5F0E8",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,0.3)"}},
    h('div',{style:{display:"flex",alignItems:"center",gap:6}},
      h('button',{onClick:()=>{if(curM===1){setCurY(y=>y-1);setCurM(12);}else setCurM(m=>m-1);setSelDay(1);},style:{background:"none",border:"none",color:"rgba(255,255,255,0.5)",fontSize:16,cursor:"pointer",padding:"2px 6px"}},"‹"),
      h('div',{style:{cursor:"pointer"},onClick:()=>setModal({type:"monthcfg"})},
        h('div',{style:{fontSize:9,letterSpacing:3,color:C.gold,fontFamily:"monospace"}},curY+" · "+MONTH_NAMES[curM-1]),
        h('div',{style:{fontSize:13,fontWeight:300}},cfg.name||MONTH_NAMES[curM-1]," ",h('span',{style:{fontSize:9,opacity:0.3}},"⚙"))
      ),
      h('button',{onClick:()=>{if(curM===12){setCurY(y=>y+1);setCurM(1);}else setCurM(m=>m+1);setSelDay(1);},style:{background:"none",border:"none",color:"rgba(255,255,255,0.5)",fontSize:16,cursor:"pointer",padding:"2px 6px"}},"›")
    ),
    h('div',{style:{display:"flex",gap:4}},
      [["dash","🏠"],["today","☀️"],["cal","📅"],["goals","🎯"],["builds","🛠"]].map(([v,ic])=>
        h('button',{key:v,onClick:()=>setView(v),style:{background:view===v?C.gold:"rgba(255,255,255,0.1)",color:view===v?C.ink:"#F5F0E8",border:"none",borderRadius:6,padding:"5px 9px",fontSize:13,cursor:"pointer"}},ic)
      )
    )
  );

  // ── VIEWS ──
  let ViewComponent = null;

  if(view==="dash") ViewComponent = DashView({curY,curM,mk,cfg,totalDays,todayD,isCurMonth,getTasks,done,getMeta,getSched,goals,setView,setSelDay,setTasks,quickAddTask,toast,getWD,isWE,getDayTheme});
  if(view==="today") ViewComponent = TodayView({curY,curM,selDay,setSelDay,totalDays,todayD,isCurMonth,theme,getTasks,done,getMeta,setMeta,getSched,addBlock,removeBlock,setSchedule,note,setNote,toggleDone,isMobile,setModal,modal,startBlockDrag,dragBlockId,dropHint,SLOT_H,HOURS,HOUR_START,HOUR_END,getDayTheme,getWD,isWE});
  if(view==="cal")   ViewComponent = CalView({curY,curM,totalDays,selDay,setSelDay,setView,todayD,isCurMonth,getTasks,done,getMeta,getSched,getDayTheme,getWD,isWE});
  if(view==="goals") ViewComponent = GoalsView({goals,setGoals,setModal});
  if(view==="builds") ViewComponent = BuildsView({builds,setBuilds,curY,curM,mk,selDay,getDayTheme,getWD,setModal});

  // ── MODAL ──
  let ModalComp = null;
  if(modal) {
    if(modal.type==="goallink") ModalComp = GoalLinkModal({modal,setModal,goals,setGoals});
    if(modal.type==="edittask") ModalComp = EditTaskModal({modal,setModal,getTasks,setTasks});
    if(modal.type==="editblock") ModalComp = EditBlockModal({modal,setModal,setSchedule,theme});
    if(modal.type==="editgoal") ModalComp = EditGoalModal({modal,setModal,goals,setGoals,uid});
    if(modal.type==="editmeta") ModalComp = EditMetaModal({modal,setModal,getTasks,getMeta,setMeta,theme});
    if(modal.type==="editbuild") ModalComp = EditBuildModal({modal,setModal,builds,setBuilds,uid});
    if(modal.type==="monthcfg") ModalComp = MonthCfgModal({modal,setModal,cfg,allConfigs,setAllConfigs,mk,curY,curM,totalDays,isWE,getDayTheme});
  }

  return h('div',{style:{fontFamily:"'Noto Serif TC',serif",background:C.bg,minHeight:"100dvh",color:C.ink}},
    NAV, ViewComponent, ModalComp,
    toast && h('div',{style:{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",background:"#EEF6EE",borderRadius:10,padding:"10px 20px",fontSize:13,color:"#3D7A3D",fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.15)",zIndex:200,whiteSpace:"nowrap"}},toast)
  );
}

// ─────────────────────────────────────────────────────────
// VIEW: DASHBOARD
// ─────────────────────────────────────────────────────────
function DashView({curY,curM,mk,cfg,totalDays,todayD,isCurMonth,getTasks,done,getMeta,getSched,goals,setView,setSelDay,setTasks,quickAddTask,toast,getWD,isWE,getDayTheme}) {
  const [qtext,setQtext] = useState("");
  const today2=isCurMonth?todayD:1;
  const todayTheme=THEMES[getDayTheme(today2)]||THEMES.free;
  const todayTasks=getTasks(today2);
  const todayDone=todayTasks.filter((_,i)=>done[today2+"-"+i]).length;
  const todaySched=getSched(today2);

  const workdays=Array.from({length:totalDays},(_,i)=>i+1).filter(d=>!isWE(curY,curM,d));
  const passedDays=workdays.filter(d=>d<=(isCurMonth?todayD:totalDays));
  const totalT=workdays.reduce((s,d)=>s+getTasks(d).length,0);
  const doneT=workdays.reduce((s,d)=>s+getTasks(d).filter((_,i)=>done[d+"-"+i]).length,0);
  const pct=totalT>0?Math.round(doneT/totalT*100):0;

  const upcoming=[];
  for(let d=today2;d<=totalDays;d++){
    if(isWE(curY,curM,d)) continue;
    getTasks(d).forEach((t,i)=>{
      if(!done[d+"-"+i]){const m=getMeta(d,i);upcoming.push({day:d,task:t,idx:i,priority:m.priority,estMins:m.estMins});}
    });
  }
  const pOrd={must:0,should:1,nice:2};
  const top5=upcoming.sort((a,b)=>pOrd[a.priority]-pOrd[b.priority]||a.day-b.day).slice(0,5);
  const goalSum=goals.map(g=>({...g,pct:Math.min(100,Math.round(g.count/g.target*100))}));

  const wd=getWD(curY,curM,today2);
  const monOff=wd===0?-6:1-wd;
  const weekDays=Array.from({length:7},(_,i)=>{const d=today2+monOff+i;return (d>=1&&d<=totalDays)?d:null;});

  const addQ=(d)=>{
    if(!qtext.trim()) return;
    quickAddTask(d,qtext);
    setQtext("");
  };

  return h('div',{style:{padding:"14px 14px 80px",overflowY:"auto",minHeight:"calc(100dvh - 50px)"}},
    // Greeting
    h('div',{style:{marginBottom:18}},
      h('div',{style:{fontSize:11,color:C.sub,fontFamily:"monospace",letterSpacing:1,marginBottom:4}},curY+" · "+MONTH_NAMES[curM-1]+(isCurMonth?" · 今天 "+curM+"/"+todayD:"")),
      h('div',{style:{fontSize:22,fontWeight:700,color:C.ink,letterSpacing:"-0.5px"}},cfg.name||MONTH_NAMES[curM-1])
    ),

    // TODAY BLOCK
    h('div',{style:{background:todayTheme.bg,borderRadius:16,padding:"16px",marginBottom:14,border:"1.5px solid "+todayTheme.color+"30",boxShadow:"0 2px 12px "+todayTheme.color+"20",cursor:"pointer"},
      onClick:()=>{setSelDay(today2);setView("today");}},
      h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}},
        h('div',null,
          h('div',{style:{fontSize:10,color:todayTheme.color,fontFamily:"monospace",letterSpacing:1.5,marginBottom:3,opacity:0.8}},(isCurMonth?"TODAY":"本月起點")+" · "+curM+"/"+today2),
          h('div',{style:{fontSize:20,fontWeight:700,color:todayTheme.color}},todayTheme.icon+" "+todayTheme.label)
        ),
        h('div',{style:{textAlign:"right"}},
          h('div',{style:{fontSize:10,color:todayTheme.color,opacity:0.7,marginBottom:2}},"今日任務"),
          h('div',{style:{fontSize:22,fontWeight:700,color:todayTheme.color}},todayDone,h('span',{style:{fontSize:13,fontWeight:400,opacity:0.6}},"/"+todayTasks.length))
        )
      ),
      todaySched.length>0
        ? h('div',{style:{display:"flex",flexDirection:"column",gap:5}},
            todaySched.slice(0,3).map(b=>
              h('div',{key:b.id,style:{display:"flex",alignItems:"center",gap:8,background:todayTheme.color+"12",borderRadius:8,padding:"6px 10px"}},
                h('div',{style:{width:3,minHeight:16,background:todayTheme.color,borderRadius:2,flexShrink:0}}),
                h('div',{style:{fontSize:11,fontFamily:"monospace",color:todayTheme.color,flexShrink:0}},fmt(b.startH,b.startM||0)),
                h('div',{style:{fontSize:12,color:C.ink,fontWeight:500,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},b.taskText)
              )

// ─────────────────────────────────────────────────────────
// VIEW: TODAY
// ─────────────────────────────────────────────────────────
function TodayView({curY,curM,selDay,setSelDay,totalDays,todayD,isCurMonth,theme,getTasks,done,getMeta,setMeta,getSched,addBlock,removeBlock,setSchedule,note,setNote,toggleDone,isMobile,setModal,modal,startBlockDrag,dragBlockId,dropHint,SLOT_H,HOURS,HOUR_START,HOUR_END,getDayTheme,getWD,isWE}) {
  const dayNote=note[selDay]||"";
  const tasks=getTasks(selDay);
  const sched=getSched(selDay);
  const comp=tasks.filter((_,i)=>done[selDay+"-"+i]).length;

  const Header = h('div',{style:{background:theme.bg,borderBottom:"1px solid "+theme.color+"25",padding:"10px 14px 8px",flexShrink:0}},
    h('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},

      )

    h('div',{style:{overflowX:"auto",display:"flex",gap:3,paddingBottom:2}},
      Array.from({length:totalDays},(_,i)=>i+1).map(d=>{
        const m=THEMES[getDayTheme(d)]||THEMES.free;
        const isSel=d===selDay, isToday=isCurMonth&&d===todayD;
        return h('button',{key:d,onClick:()=>setSelDay(d),style:{minWidth:28,height:28,borderRadius:6,background:isSel?m.color:m.bg,border:isToday?"2px solid "+m.color:"1px solid "+m.color+"20",color:isSel?"#fff":m.color,fontSize:10,fontFamily:"monospace",fontWeight:isSel?700:400,cursor:"pointer",flexShrink:0}},d);

  const TaskList = h('div',{style:{flexShrink:0,background:"#FAF8F4",borderBottom:"1px solid "+theme.color+"20",maxHeight:"42vh",overflow:"hidden",display:"flex",flexDirection:"column"}},
    h('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 14px 6px",flexShrink:0}},
      h('span',{style:{fontSize:11,fontWeight:600,color:"#555"}},comp+"/"+tasks.length+" 完成"),
      h('div',{style:{display:"flex",gap:6}},
        h('button',{onClick:()=>setModal({type:"edittask",day:selDay,tasks:getTasks(selDay)}),style:{background:"none",border:"1px solid #e8e4de",borderRadius:7,padding:"4px 10px",cursor:"pointer",fontSize:12,color:"#888",fontFamily:"inherit"}},"✏️ 編輯"),
        h('button',{onClick:()=>{const t=prompt("任務名稱：");if(t&&t.trim()){const h2=parseInt(prompt("幾點排入 (6-22)？","9")||"9");addBlock(selDay,t.trim(),Math.min(22,Math.max(6,h2||9)));getTasks(selDay);/* trigger re-render */setModal(null);}},style:{background:theme.color,border:"none",borderRadius:7,padding:"4px 12px",cursor:"pointer",fontSize:12,color:"#fff",fontWeight:600,fontFamily:"inherit"}},"＋ 新增")
      )

    h('div',{style:{overflowY:"auto",padding:"0 10px 8px"}},
      tasks.length===0&&h('div',{style:{textAlign:"center",padding:"12px",fontSize:12,color:"#ccc"}},"點「＋ 新增」加入今日任務"),
      tasks.map((task,i)=>{
        const isDone=!!done[selDay+"-"+i];
        const inSched=sched.some(b=>b.taskText===task);
        const meta=getMeta(selDay,i);
        const pColor=PRIORITY[meta.priority]?.color||"#aaa";
        return h('div',{key:i,style:{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",marginBottom:4,background:isDone?"#f5f2ee":inSched?theme.color+"10":"#fff",borderRadius:10,border:"1px solid "+(inSched?theme.color+"40":"#ede9e4")}},
          h('div',{onClick:()=>toggleDone(selDay,i),style:{width:22,height:22,borderRadius:6,flexShrink:0,border:"2px solid "+(isDone?theme.color:"#d0cbc4"),background:isDone?theme.color:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}},

          ),
          h('span',{style:{flex:1,fontSize:14,lineHeight:1.4,color:isDone?"#bbb":"#1A1612",textDecoration:isDone?"line-through":"none"}},task),
          !inSched?h('button',{onClick:()=>{
            const now=new Date();

          },style:{flexShrink:0,background:theme.color+"15",border:"1px solid "+theme.color+"40",borderRadius:8,padding:"4px 10px",fontSize:11,color:theme.color,cursor:"pointer",fontFamily:"monospace",whiteSpace:"nowrap"}},"+ 排入")

        const n=new Date(),top2=((n.getHours()-HOUR_START)+n.getMinutes()/60)*SLOT_H;
        if(top2<0||top2>SLOT_H*(HOUR_END-HOUR_START+1)) return null;
        return h('div',{style:{position:"absolute",left:48,right:0,top:top2,height:2,background:"#E53E3E",zIndex:20,pointerEvents:"none"}},
          h('div',{style:{position:"absolute",left:-5,top:-4,width:10,height:10,borderRadius:"50%",background:"#E53E3E"}})

      sched.map(block=>{

          h('div',{onMouseDown:e=>startBlockDrag(e,"move",block),onTouchStart:e=>startBlockDrag(e,"move",block),style:{padding:"5px 8px",cursor:"ns-resize",height:"calc(100% - 14px)",overflow:"hidden"}},

                h('div',{style:{fontWeight:600,color:"#1A1612",fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:bH>SLOT_H?"normal":"nowrap"}},block.taskText)
              ),

                h('button',{onClick:e=>{e.stopPropagation();setModal({type:"editblock",day:selDay,block});},style:{background:"none",border:"none",cursor:"pointer",fontSize:12,color:"#bbb",padding:"0 2px",fontFamily:"inherit"}},"✏️"),
                h('button',{onClick:e=>{e.stopPropagation();removeBlock(selDay,block.id);},style:{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#ccc",padding:"0 2px",fontFamily:"inherit"}},"✕")

          )
        );
      })
    )
  );

  const NoteBar = h('div',{style:{borderTop:"1px solid #e8e4de",background:"#FAF8F4",padding:"8px 14px",display:"flex",alignItems:"center",gap:8,flexShrink:0}},

  );

  return h('div',{style:{display:"flex",flexDirection:"column",height:"calc(100dvh - 50px)"}},

      Array.from({length:offset},(_,i)=>h('div',{key:"e"+i})),
      Array.from({length:totalDays},(_,i)=>i+1).map(day=>{
        const th=getDayTheme(day);

        const dt=getTasks(day);
        const comp=dt.filter((_,i)=>done[day+"-"+i]).length;
        const total=dt.length;
        const sched=getSched(day).length;
        const weekend=isWE(curY,curM,day);
        return h('div',{key:day,onClick:()=>{setSelDay(day);setView("today");},
          style:{background:isSel?m.color:weekend?"transparent":m.bg,border:isToday?"2px solid "+m.color:"1px solid "+(weekend?"transparent":m.color+"20"),borderRadius:8,padding:"5px 4px",cursor:"pointer",display:"flex",flexDirection:"column",gap:2,overflow:"hidden",minHeight:0}},
          h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
            h('span',{style:{fontFamily:"monospace",fontSize:11,fontWeight:700,background:isToday&&!isSel?m.color:"transparent",color:isToday&&!isSel?"#fff":isSel?"#fff":m.color,borderRadius:4,padding:isToday&&!isSel?"1px 4px":"0"}},day),
            !weekend&&h('span',{style:{fontSize:11,opacity:0.8}},m.icon)
          ),
          !weekend&&h('div',{style:{display:"flex",flexWrap:"wrap",gap:2}},
            dt.slice(0,4).map((_,i)=>{

          )

      })
    )
  );
}
